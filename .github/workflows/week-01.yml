name: Week 1 — bytecount

on:
  push:
    paths:
      - "assignments/week-01-toolchain/**"
      - ".github/workflows/week-01.yml"
  pull_request:
    paths:
      - "assignments/week-01-toolchain/**"
      - ".github/workflows/week-01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/week-01-toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Strict build
        run: make clean all
      - name: Acceptance tests
        run: make test
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize
